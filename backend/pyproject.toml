[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "localsm-ai-exam-portal"
version = "0.1.0"
description = "LocalSM Secure AI Exam Portal — Backend"
requires-python = ">=3.14"

# ==============================================================
# pytest
# ==============================================================
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "--tb=short",
    "-v",
    "--strict-markers",
]
markers = [
    "unit: Unit tests (no DB, no network)",
    "integration: Integration tests (require test DB)",
    "security: Security-specific test cases",
]

# ==============================================================
# ruff (linting + formatting)
# ==============================================================
[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "T20", # flake8-print (no bare prints)
    "ANN", # type annotations
    "PT",  # pytest style
]
ignore = [
    "ANN101",  # missing self annotation
    "ANN102",  # missing cls annotation
    "S101",    # assert allowed in tests
    "S106",    # hardcoded passwords — false positives in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "ANN"]

# ==============================================================
# mypy
# ==============================================================
[tool.mypy]
python_version = "3.14"
strict = false
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ==============================================================
# coverage
# ==============================================================
[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "alembic/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
